<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="titulo-svg-inicio">
  <title id="titulo-svg-inicio">Diagrama sobre tecnologia assistiva no cotidiano: celular com leitor de tela conectado a casa adaptada, legendas e uso por teclado</title>
  <rect width="600" height="340" fill="#e9eef5"/>

  <line x1="170" y1="170" x2="240" y2="170" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="360" y1="130" x2="430" y2="105" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="360" y1="210" x2="430" y2="235" stroke="#1d4ed8" stroke-width="2"/>

  <rect x="30" y="105" width="140" height="130" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="100,125 65,155 135,155" fill="#1d4ed8"/>
  <rect x="77" y="155" width="46" height="35" fill="#93c5fd"/>
  <text x="100" y="212" fill="#1e293b" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Casa Adaptada</text>

  <rect x="240" y="45" width="120" height="250" fill="#1e293b"/>
  <rect x="250" y="65" width="100" height="205" fill="#ffffff"/>
