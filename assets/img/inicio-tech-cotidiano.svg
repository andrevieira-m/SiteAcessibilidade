  <text x="500" y="130" fill="#1e293b" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Libras e Legenda</text>

  <rect x="430" y="185" width="140" height="100" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="465" y="202" width="70" height="30" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="500" y="222" fill="#1e293b" font-family="Courier New, monospace" font-size="14" font-weight="bold" text-anchor="middle">TAB</text>
  <text x="500" y="260" fill="#1e293b" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Uso por Teclado</text>
