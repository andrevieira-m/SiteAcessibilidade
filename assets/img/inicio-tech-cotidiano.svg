  <rect x="270" y="150" width="8" height="24" fill="#1d4ed8"/>
  <rect x="284" y="138" width="8" height="36" fill="#1d4ed8"/>
  <rect x="298" y="144" width="8" height="30" fill="#1d4ed8"/>
  <rect x="312" y="134" width="8" height="40" fill="#1d4ed8"/>
  <rect x="326" y="152" width="8" height="22" fill="#1d4ed8"/>

  <rect x="262" y="195" width="76" height="32" fill="#1e293b"/>
  <text x="300" y="216" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">A+ | eMAG</text>

  <rect x="430" y="55" width="140" height="100" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="475" y="72" width="50" height="30" fill="#1d4ed8"/>
