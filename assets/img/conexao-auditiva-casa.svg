<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-labelledby="titulo-svg-audicao">
  <title id="titulo-svg-audicao">Diagrama com tres exemplos de acessibilidade auditiva: alerta com luz, relogio vibratorio e legenda na tela</title>
  <rect width="600" height="320" fill="#e9eef5"/>

  <rect x="30" y="50" width="160" height="220" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="78" y="85" width="64" height="60" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="110" y="120" fill="#854d0e" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">LUZ</text>
  <text x="110" y="185" fill="#1e293b" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Luz de Alerta</text>
  <text x="110" y="210" fill="#475569" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Pisca ao tocar</text>
  <text x="110" y="228" fill="#475569" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">a campainha</text>

  <rect x="220" y="50" width="160" height="220" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="268" y="85" width="64" height="60" fill="#1e293b"/>
  <text x="300" y="120" fill="#ffffff" font-family="Courier New, monospace" font-size="14" font-weight="bold" text-anchor="middle">07:00</text>
  <text x="300" y="185" fill="#1e293b" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Alarme Vibratorio</text>
  <text x="300" y="210" fill="#475569" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Despertador no</text>
  <text x="300" y="228" fill="#475569" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">pulso ou cama</text>

  <rect x="410" y="50" width="160" height="220" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="445" y="88" width="90" height="54" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="490" y="120" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">CC / Libras</text>
  <text x="490" y="185" fill="#1e293b" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Texto e Libras</text>
  <text x="490" y="210" fill="#475569" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Transcricao de voz</text>
  <text x="490" y="228" fill="#475569" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">em tempo real</text>
</svg>
