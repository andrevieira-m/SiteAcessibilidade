<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-labelledby="titulo-svg-lazer">
  <title id="titulo-svg-lazer">Diagrama de controle de videogame adaptado com dois botoes grandes A e B e direcional</title>
  <rect width="600" height="320" fill="#e9eef5"/>

  <rect x="85" y="55" width="430" height="210" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>

  <rect x="142" y="115" width="24" height="76" fill="#334155"/>
  <rect x="116" y="141" width="76" height="24" fill="#334155"/>

  <rect x="235" y="103" width="100" height="100" fill="#1e293b"/>
  <text x="285" y="161" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">A</text>

  <rect x="365" y="103" width="100" height="100" fill="#1d4ed8"/>
  <text x="415" y="161" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">B</text>

  <text x="300" y="242" fill="#334155" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Controle Adaptado com Botoes Grandes (Switches)</text>
</svg>
