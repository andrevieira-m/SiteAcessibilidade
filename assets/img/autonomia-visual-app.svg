  <text x="155" y="91" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">LEITE 1 LITRO</text>

  <circle cx="105" cy="122" r="3.5" fill="#1e293b"/>
  <circle cx="117" cy="122" r="3.5" fill="#1e293b"/>
  <circle cx="105" cy="134" r="3.5" fill="#1e293b"/>
  <circle cx="140" cy="122" r="3.5" fill="#1e293b"/>
  <circle cx="152" cy="134" r="3.5" fill="#1e293b"/>
  <circle cx="175" cy="122" r="3.5" fill="#1e293b"/>
